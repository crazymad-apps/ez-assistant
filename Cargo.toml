[workspace]
members = [
    "apps/desktop/src-tauri",
    "apps/runtime-host",
    "crates/agent-context",
    "crates/agent-core",
    "crates/agent-memory",
    "crates/agent-model",
    "crates/agent-openai-compatible",
    "crates/agent-sdk",
    "crates/agent-testkit",
    "crates/agent-tools",
    "crates/agent-tools-local",
    "crates/agent-types",
    "crates/assistant-protocol",
    "crates/assistant-runtime",
    "tools/core-demo",
    "tools/debug-viewer",
    "tools/memory-demo",
    "tools/reliability-demo",
    "tools/runtime-harness",
    "tools/safety-demo",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.22.0"

[workspace.dependencies]
async-stream = "0.3.6"
axum = "0.8.4"
axum-server = "0.8.0"
base64 = "0.22.1"
clap = { version = "4.6.5", features = ["derive"] }
dotenvy = "0.15.7"
dirs = "6.0.0"
libc = "0.2.177"
futures-core = "0.3.32"
futures-util = "0.3.32"
getrandom = "0.4.3"
hmac = "0.12.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
infer = "0.19.0"
path-absolutize = "4.0.1"
process-wrap = { version = "9.1.0", default-features = false, features = [
    "tokio1",
    "process-group",
    "job-object",
    "creation-flags",
    "kill-on-drop",
] }
rand_core = { version = "0.9.5", features = ["os_rng"] }
rcgen = "0.14.9"
quick-xml = "0.41.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tempfile = "3.27.0"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
tokio = { version = "1.52.4", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
toml = "0.9.12"
toml_edit = "0.25.12"
tower-http = { version = "0.6.11", features = ["fs"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

# 该 workspace 包含多个应用和验证宿主；Cargo 默认的完整调试信息、macOS unpacked
# 调试产物与增量缓存叠加后会使 target 长期快速膨胀。开发构建保留文件/行号回溯，
# 但不保存变量级调试信息和增量编译状态。test profile 会继承这些设置。
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"
incremental = false
