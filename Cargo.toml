[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/agent-core",
    "crates/agent-model",
    "crates/agent-provider-openai-compatible",
    "crates/agent-testkit",
    "crates/agent-tools",
    "crates/agent-types",
    "crates/assistant-protocol",
    "crates/assistant-runtime",
    "tools/debug-viewer",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-stream = "0.3.6"
axum = "0.8.4"
dotenvy = "0.15.7"
futures-core = "0.3.32"
futures-util = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower-http = { version = "0.6.11", features = ["fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
