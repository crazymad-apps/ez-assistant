[package]
name = "agent-tools-local"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
agent-tools = { path = "../agent-tools" }
process-wrap.workspace = true
serde.workspace = true
serde_json.workspace = true
same-file = "1.0.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time"] }
tokio-util.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"
nix = { workspace = true, features = ["event", "signal"] }
rustix = { version = "1.1.4", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["event", "fs", "process"] }

[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", features = ["advapi"] }

[dev-dependencies]
tempfile.workspace = true
