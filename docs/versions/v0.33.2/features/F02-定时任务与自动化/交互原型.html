    for(let i=0;i&lt;=7;i++) {
      const d=new Date(demoTime);
      d.setDate(d.getDate()+i);
      d.setHours(hour,minute,0,0);
      if(d&gt;demoTime &amp;&amp; (p.rule===&#x27;每日&#x27;||p.days.includes(d.getDay()))) return d;
    }
    return null;
  }
  function nextLabel(p) {
    if(p.paused) return &#x27;已暂停&#x27;;
    const next=nextTime(p);
    return next?&#x27;下次 &#x27;+dateLabel(next):&#x27;已错过&#x27;;
  }
  function save() {
    const state={modelContent:{页面:s.view,计划:plan()?.name??null},privateContent:s};
    if(JSON.stringify(state).length&lt;5500) window.openai?.setWidgetState?.(state)?.catch(()=&gt;{});
  }
  function navigate(view,pid=s.pid,rid=s.rid) { s.view=view; s.pid=pid; s.rid=rid; notice=&#x27;&#x27;; render(); save(); }
  function resultBody(item) {
    if(item.kind===scriptType) {
      const code=item.code==null?item.status:&#x27;退出码 &#x27;+item.code;
      return &#x27;&lt;section&gt;&lt;small&gt;&#x27;+esc(code)+&#x27;&lt;/small&gt;&lt;small&gt;标准输出&lt;/small&gt;&lt;pre&gt;&#x27;+esc(item.stdout||&#x27;（无输出）&#x27;)+&#x27;&lt;/pre&gt;&lt;small&gt;标准错误&lt;/small&gt;&lt;pre&gt;&#x27;+esc(item.stderr||&#x27;（无输出）&#x27;)+&#x27;&lt;/pre&gt;&lt;/section&gt;&#x27;;
    }
    return &#x27;&lt;p&gt;&#x27;+esc(item.summary)+&#x27;&lt;/p&gt;&#x27;+(item.file?button(item.file,&#x27;file&#x27;,&#x27;file&#x27;,item.id):&#x27;&#x27;);
  }
  function render() {
    const p=plan(), r=run();
    root.querySelectorAll(&#x27;[data-go]&#x27;).forEach(el=&gt;{
      if(el.dataset.go===(s.view===&#x27;inbox&#x27;?&#x27;inbox&#x27;:&#x27;list&#x27;)) el.setAttribute(&#x27;aria-current&#x27;,&#x27;page&#x27;);
      else el.removeAttribute(&#x27;aria-current&#x27;);
    });
    const back=button(&#x27;‹ 计划列表&#x27;,&#x27;list&#x27;,&#x27;back&#x27;);
    if(s.view===&#x27;inbox&#x27;) {
      main.innerHTML=&#x27;&lt;header&gt;&lt;h2&gt;助理会话&lt;/h2&gt;&lt;/header&gt;&#x27;+s.reports.map(item=&gt;
        &#x27;&lt;article&gt;&lt;small&gt;&#x27;+esc(item.at)+&#x27; · &#x27;+esc(item.status)+&#x27;&lt;/small&gt;&lt;strong&gt;&#x27;+esc(item.name)+&#x27;&lt;/strong&gt;&#x27;+resultBody(item)+&#x27;&lt;/article&gt;&#x27;).join(&#x27;&#x27;);
    } else if(s.view===&#x27;detail&#x27;&amp;&amp;p) {
      main.innerHTML=back+&#x27;&lt;header&gt;&lt;h2&gt;&#x27;+esc(p.name)+&#x27;&lt;/h2&gt;&#x27;+button(&#x27;删除计划&#x27;,&#x27;delete&#x27;,&#x27;danger&#x27;)+&#x27;&lt;/header&gt;&#x27;+
        &#x27;&lt;section&gt;&lt;small&gt;&#x27;+esc(p.kind)+&#x27;&lt;/small&gt;&#x27;+(p.kind===scriptType?&#x27;&lt;pre&gt;&#x27;+esc(p.command)+&#x27;&lt;/pre&gt;&#x27;:&#x27;&lt;p&gt;&#x27;+esc(p.prompt)+&#x27;&lt;/p&gt;&#x27;)+&#x27;&lt;small&gt;&#x27;+esc(ruleLabel(p))+&#x27; · &#x27;+esc(nextLabel(p))+&#x27;&lt;/small&gt;&lt;small&gt;本机 · &#x27;+esc(p.project||&#x27;独立计划&#x27;)+&#x27; · &#x27;+(p.send?&#x27;结果返回主控会话&#x27;:&#x27;结果仅保存在执行记录&#x27;)+&#x27;&lt;/small&gt;&lt;/section&gt;&#x27;+
        &#x27;&lt;div class=&quot;actions&quot;&gt;&#x27;+button(&#x27;立即执行&#x27;,&#x27;now&#x27;,&#x27;primary&#x27;)+button(p.paused?&#x27;恢复&#x27;:&#x27;暂停&#x27;,&#x27;toggle&#x27;)+button(&#x27;编辑&#x27;,&#x27;edit&#x27;)+&#x27;&lt;/div&gt;&#x27;+
        (notice?&#x27;&lt;p role=&quot;status&quot;&gt;&#x27;+esc(notice)+&#x27; &#x27;+button(&#x27;查看进行中的执行&#x27;,&#x27;execution&#x27;,&#x27;link&#x27;,p.runs.find(active)?.id)+&#x27;&lt;/p&gt;&#x27;:&#x27;&#x27;)+
        &#x27;&lt;h3&gt;执行记录&lt;/h3&gt;&#x27;+(p.runs.length?p.runs.map(x=&gt;&#x27;&lt;div class=&quot;collection&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;row&quot; data-act=&quot;execution&quot; data-key=&quot;&#x27;+esc(x.id)+&#x27;&quot;&gt;&lt;span&gt;&#x27;+esc(x.at)+&#x27;&lt;small&gt;&#x27;+esc(x.origin)+&#x27;触发&lt;/small&gt;&lt;/span&gt;&lt;span&gt;&#x27;+esc(x.status)+&#x27; ›&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;):&#x27;&lt;p class=&quot;muted&quot;&gt;暂无执行记录&lt;/p&gt;&#x27;);
    } else if(s.view===&#x27;run&#x27;&amp;&amp;p&amp;&amp;r) {
      main.innerHTML=button(&#x27;‹ &#x27;+p.name,&#x27;detail&#x27;,&#x27;back&#x27;)+&#x27;&lt;header&gt;&lt;h2&gt;本次执行&lt;/h2&gt;&lt;/header&gt;&lt;small&gt;&#x27;+esc(r.at)+&#x27; · &#x27;+esc(r.origin)+&#x27;触发&lt;/small&gt;&#x27;+
        &#x27;&lt;h3&gt;&#x27;+esc(r.status===&#x27;后台仍运行&#x27;?&#x27;Agent 已完成 · 后台仍运行&#x27;:r.status)+&#x27;&lt;/h3&gt;&#x27;+
        (!active(r)?resultBody(r):&#x27;&#x27;)+
        (r.status===&#x27;运行中&#x27;?&#x27;&lt;p class=&quot;muted&quot;&gt;&#x27;+(r.kind===scriptType?&#x27;正在运行脚本&#x27;:&#x27;Agent 正在执行任务&#x27;)+&#x27;&lt;/p&gt;&#x27;:&#x27;&#x27;)+
        (active(r)?&#x27;&lt;div class=&quot;actions&quot;&gt;&#x27;+button(&#x27;停止本次执行&#x27;,&#x27;stop&#x27;,&#x27;danger&#x27;)+&#x27;&lt;/div&gt;&#x27;:r.send?&#x27;&lt;p class=&quot;muted&quot;&gt;结果已送达&lt;/p&gt;&#x27;+button(&#x27;前往助理会话&#x27;,&#x27;inbox&#x27;,&#x27;link&#x27;):&#x27;&lt;p class=&quot;muted&quot;&gt;仅保存在执行记录&lt;/p&gt;&#x27;);
    } else {
      main.innerHTML=&#x27;&lt;header&gt;&lt;h2&gt;定时任务&lt;/h2&gt;&#x27;+button(&#x27;新建计划&#x27;,&#x27;new&#x27;,&#x27;primary&#x27;)+&#x27;&lt;/header&gt;&#x27;+
        (s.plans.length?s.plans.map(item=&gt;&#x27;&lt;div class=&quot;collection&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;row&quot; data-act=&quot;open&quot; data-key=&quot;&#x27;+esc(item.id)+&#x27;&quot;&gt;&lt;span&gt;&lt;strong&gt;&#x27;+esc(item.name)+&#x27;&lt;/strong&gt;&lt;small&gt;&#x27;+esc(item.kind)+&#x27; · &#x27;+esc(ruleLabel(item))+&#x27;&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;right&quot;&gt;&lt;small&gt;&#x27;+esc(nextLabel(item))+&#x27;&lt;/small&gt;&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&#x27;).join(&#x27;&#x27;):&#x27;&lt;p class=&quot;muted&quot;&gt;暂无定时计划&lt;/p&gt;&#x27;);
    }
  }
  function popup(title,body) {
    dialog.innerHTML=&#x27;&lt;header&gt;&lt;h2 id=&quot;ez-schedule-modal-title&quot;&gt;&#x27;+esc(title)+&#x27;&lt;/h2&gt;&lt;/header&gt;&#x27;+body;
    dialog.showModal();
  }
  function formData(f) {
    const values=new FormData(f);
    const kind=values.get(&#x27;kind&#x27;);
    const specific=kind===scriptType?{command:String(values.get(&#x27;command&#x27;)||&#x27;&#x27;).trim()}:{prompt:String(values.get(&#x27;prompt&#x27;)||&#x27;&#x27;).trim(),agent:values.get(&#x27;agent&#x27;),model:values.get(&#x27;model&#x27;),permission:values.get(&#x27;permission&#x27;)};
    return {kind,...specific,send:values.has(&#x27;send&#x27;),name:values.get(&#x27;name&#x27;).trim(),project:values.get(&#x27;project&#x27;),rule:values.get(&#x27;rule&#x27;),date:values.get(&#x27;date&#x27;),time:values.get(&#x27;time&#x27;),days:values.getAll(&#x27;days&#x27;).map(Number)};
  }
  function formPreview(f) {
    for(const area of f.querySelectorAll(&#x27;[data-kind]&#x27;)) {
      area.hidden=area.dataset.kind!==f.elements.namedItem(&#x27;kind&#x27;).value;
      area.disabled=area.hidden;
    }
    const data=formData(f);
    f.querySelector(&#x27;[data-date]&#x27;).hidden=data.rule!==&#x27;一次&#x27;;
    f.querySelector(&#x27;[data-week]&#x27;).hidden=data.rule!==&#x27;每周&#x27;;
    const next=nextTime(data);
    f.querySelector(&#x27;output&#x27;).textContent=next?&#x27;下次执行 · &#x27;+dateLabel(next):data.rule===&#x27;每周&#x27;?&#x27;请选择执行日&#x27;:&#x27;请选择未来的执行时间&#x27;;
    f.querySelector(&#x27;[type=submit]&#x27;).disabled=!next;
  }
  function editor(p) {
    const data=p||{name:&#x27;&#x27;,kind:agentType,send:true,project:&#x27;&#x27;,rule:&#x27;每日&#x27;,date:&#x27;2026-11-20&#x27;,time:&#x27;09:00&#x27;,days:[1,2,3,4,5]};
    const options=(items,selected)=&gt;items.map(x=&gt;&#x27;&lt;option value=&quot;&#x27;+esc(x)+&#x27;&quot;&#x27;+(x===selected?&#x27; selected&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+esc(x||&#x27;无项目&#x27;)+&#x27;&lt;/option&gt;&#x27;).join(&#x27;&#x27;);
    popup(p?&#x27;编辑计划&#x27;:&#x27;新建计划&#x27;,&#x27;&lt;form&gt;&lt;div class=&quot;pair&quot;&gt;&lt;label&gt;类型&lt;select name=&quot;kind&quot;&gt;&#x27;+options([agentType,scriptType],data.kind)+&#x27;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;名称&lt;input name=&quot;name&quot; maxlength=&quot;80&quot; required value=&quot;&#x27;+esc(data.name)+&#x27;&quot;&gt;&lt;/label&gt;&lt;/div&gt;&#x27;+
      &#x27;&lt;fieldset data-kind=&quot;Agent 型&quot;&gt;&lt;label&gt;任务指令&lt;textarea name=&quot;prompt&quot; maxlength=&quot;600&quot; rows=&quot;2&quot; required&gt;&#x27;+esc(data.prompt)+&#x27;&lt;/textarea&gt;&lt;/label&gt;&lt;div class=&quot;pair&quot;&gt;&lt;label&gt;智能体&lt;select name=&quot;agent&quot;&gt;&#x27;+options([&#x27;默认智能体&#x27;,&#x27;写作助手&#x27;],data.agent)+&#x27;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;模型&lt;select name=&quot;model&quot;&gt;&#x27;+options([&#x27;默认模型&#x27;,&#x27;GPT-6.2 Sol&#x27;],data.model)+&#x27;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;label&gt;权限模式&lt;select name=&quot;permission&quot;&gt;&#x27;+options([&#x27;仅执行已授权操作&#x27;,&#x27;自动&#x27;],data.permission||&#x27;仅执行已授权操作&#x27;)+&#x27;&lt;/select&gt;&lt;/label&gt;&lt;/fieldset&gt;&#x27;+
      &#x27;&lt;fieldset data-kind=&quot;脚本型&quot;&gt;&lt;label&gt;Shell 命令或脚本&lt;textarea name=&quot;command&quot; rows=&quot;3&quot; required placeholder=&quot;例如 git ls-files | wc -l&quot;&gt;&#x27;+esc(data.command)+&#x27;&lt;/textarea&gt;&lt;/label&gt;&lt;/fieldset&gt;&#x27;+
      &#x27;&lt;div class=&quot;pair&quot;&gt;&lt;label&gt;重复&lt;select name=&quot;rule&quot;&gt;&#x27;+options([&#x27;一次&#x27;,&#x27;每日&#x27;,&#x27;每周&#x27;],data.rule)+&#x27;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;时间&lt;input type=&quot;time&quot; name=&quot;time&quot; required value=&quot;&#x27;+esc(data.time)+&#x27;&quot;&gt;&lt;/label&gt;&lt;/div&gt;&#x27;+
      &#x27;&lt;label data-date&gt;日期&lt;input type=&quot;date&quot; name=&quot;date&quot; value=&quot;&#x27;+esc(data.date||&#x27;2026-11-20&#x27;)+&#x27;&quot;&gt;&lt;/label&gt;&lt;fieldset data-week&gt;&lt;legend&gt;执行日&lt;/legend&gt;&lt;div class=&quot;line&quot;&gt;&#x27;+week.map(n=&gt;&#x27;&lt;label&gt;&lt;input type=&quot;checkbox&quot; name=&quot;days&quot; value=&quot;&#x27;+n+&#x27;&quot;&#x27;+(data.days.includes(n)?&#x27; checked&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+dayNames[n]+&#x27;&lt;/label&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;/fieldset&gt;&#x27;+
      &#x27;&lt;label&gt;项目（可选）&lt;select name=&quot;project&quot;&gt;&#x27;+options([&#x27;&#x27;,&#x27;桌面客户端&#x27;],data.project)+&#x27;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;check&quot;&gt;&lt;input type=&quot;checkbox&quot; name=&quot;send&quot; &#x27;+(data.send?&#x27;checked&#x27;:&#x27;&#x27;)+&#x27;&gt;将执行结果返回主控会话&lt;/label&gt;&lt;small&gt;执行设备 · 本机&lt;/small&gt;&lt;output aria-live=&quot;polite&quot;&gt;&lt;/output&gt;&lt;div class=&quot;line end&quot;&gt;&#x27;+button(&#x27;取消&#x27;,&#x27;cancel&#x27;)+&#x27;&lt;button type=&quot;submit&quot; class=&quot;primary&quot;&gt;保存&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;&#x27;);
    const f=dialog.querySelector(&#x27;form&#x27;);
    formPreview(f);
    f.oninput=()=&gt;formPreview(f);
    const submit=e=&gt;{
      e.preventDefault();
      if(!f.reportValidity()) return;
      const data=formData(f);
      const payloadField=data.kind===scriptType?&#x27;command&#x27;:&#x27;prompt&#x27;;
      if(!data.name||!data[payloadField]) {const field=f.elements.namedItem(!data.name?&#x27;name&#x27;:payloadField); field.setCustomValidity(&#x27;请填写内容&#x27;); field.reportValidity(); field.setCustomValidity(&#x27;&#x27;); return;}
      if(!nextTime(data)) return;
      const current=p||{id:&#x27;p&#x27;+Date.now(),paused:false,runs:[]};
      for(const field of [&#x27;command&#x27;,&#x27;prompt&#x27;,&#x27;model&#x27;,&#x27;agent&#x27;,&#x27;permission&#x27;]) delete current[field];
      Object.assign(current,data);
      if(!p) s.plans.unshift(current);
      dialog.close();
      navigate(&#x27;detail&#x27;,current.id,&#x27;&#x27;);
    };
    f.querySelector(&#x27;[type=submit]&#x27;).onclick=submit;
    f.onsubmit=submit;
  }
  function finish(r,status,result) {
    r.status=status;
    Object.assign(r,result);
    if(r.send) s.reports.unshift({...r});
    render(); save();
  }
  function completeDemoRun(pid,rid,at) {
    setTimeout(()=&gt;{
      const p=s.plans.find(item=&gt;item.id===pid);
      const r=p?.runs.find(item=&gt;item.id===rid);
      if(r?.status!==&#x27;运行中&#x27;) return;
      const result=r.kind===scriptType?{stdout:r.command===&#x27;git ls-files | wc -l&#x27;?&#x27;128&#x27;:&#x27;示例标准输出&#x27;,stderr:&#x27;&#x27;,code:0}:
        {summary:r.prompt===&#x27;整理昨天的项目提交，生成一份 Markdown 日报。&#x27;?dailySummary:&#x27;本次任务已完成。这是任务 Agent 的示例汇报。&#x27;,file:r.prompt===&#x27;整理昨天的项目提交，生成一份 Markdown 日报。&#x27;?&#x27;项目日报.md&#x27;:&#x27;&#x27;};
      finish(r,&#x27;已完成&#x27;,result);
    },Math.max(0,at-Date.now()));
  }
  root.addEventListener(&#x27;click&#x27;,e=&gt;{
    const b=e.target.closest(&#x27;button&#x27;);
    if(!b) return;
    if(b.dataset.go) {navigate(b.dataset.go); return;}
    const a=b.dataset.act,k=b.dataset.key,p=plan(),r=run();
    if(a===&#x27;list&#x27;||a===&#x27;inbox&#x27;||a===&#x27;detail&#x27;) navigate(a);
    if(a===&#x27;open&#x27;) navigate(&#x27;detail&#x27;,k,&#x27;&#x27;);
    if(a===&#x27;execution&#x27;) navigate(&#x27;run&#x27;,s.pid,k);
    if(a===&#x27;new&#x27;||a===&#x27;edit&#x27;) editor(a===&#x27;edit&#x27;?p:null);
    if(a===&#x27;toggle&#x27;) {p.paused=!p.paused; notice=&#x27;&#x27;; render(); save();}
    if(a===&#x27;now&#x27;) {
      if(p.runs.some(active)) {notice=&#x27;前一次执行尚未结束。&#x27;; render(); return;}
      const x={id:&#x27;r&#x27;+Date.now(),name:p.name,kind:p.kind,send:p.send,prompt:p.prompt,command:p.command,at:dateLabel(demoTime),origin:&#x27;手动&#x27;,status:&#x27;运行中&#x27;,finishAt:Date.now()+1600};
      p.runs.unshift(x); navigate(&#x27;run&#x27;,p.id,x.id);
      completeDemoRun(p.id,x.id,x.finishAt);
    }
    if(a===&#x27;stop&#x27;) finish(r,&#x27;已停止&#x27;,r.kind===scriptType?{stdout:&#x27;&#x27;,stderr:&#x27;&#x27;,code:null}:{summary:&#x27;本次执行已由用户停止。&#x27;});
    if(a===&#x27;delete&#x27;) {
      popup(&#x27;删除「&#x27;+p.name+&#x27;」？&#x27;,&#x27;&lt;p&gt;&#x27;+(p.runs.some(active)?&#x27;将立即停止当前执行及其后台进程。&#x27;:&#x27;&#x27;)+&#x27;此计划的执行记录和专属工作文件将被清除。&lt;/p&gt;&lt;p&gt;已送达助理会话的消息和文件仍可打开。&lt;/p&gt;&lt;div class=&quot;line end&quot;&gt;&#x27;+button(&#x27;取消&#x27;,&#x27;cancel&#x27;)+button(&#x27;删除计划&#x27;,&#x27;confirm-delete&#x27;,&#x27;danger&#x27;)+&#x27;&lt;/div&gt;&#x27;);
      dialog.querySelector(&#x27;[data-act=&quot;cancel&quot;]&#x27;).focus();
    }
    if(a===&#x27;cancel&#x27;) dialog.close();
    if(a===&#x27;confirm-delete&#x27;) {s.plans=s.plans.filter(x=&gt;x.id!==p.id); dialog.close(); navigate(&#x27;list&#x27;,&#x27;&#x27;,&#x27;&#x27;);}
    if(a===&#x27;file&#x27;) {const item=s.reports.find(x=&gt;x.id===k)||p?.runs.find(x=&gt;x.id===k); if(item) popup(item.file,&#x27;&lt;article&gt;&lt;strong&gt;&#x27;+esc(item.name)+&#x27;&lt;/strong&gt;&lt;small&gt;&#x27;+esc(item.at)+&#x27;&lt;/small&gt;&lt;p&gt;&#x27;+esc(item.summary)+&#x27;&lt;/p&gt;&lt;/article&gt;&lt;div class=&quot;actions end&quot;&gt;&#x27;+button(&#x27;关闭&#x27;,&#x27;cancel&#x27;)+&#x27;&lt;/div&gt;&#x27;);}
  });
  function restore(snapshot) {
    const saved=snapshot?.privateContent;
    if(saved?.version!==3 || !Array.isArray(saved.plans) || !Array.isArray(saved.reports)) return;
    s=structuredClone(saved);
    for(const p of s.plans) {
      if(p.kind===scriptType) delete p.permission;
      for(const r of p.runs) {
        if(r.status===&#x27;运行中&#x27; &amp;&amp; r.finishAt) completeDemoRun(p.id,r.id,r.finishAt);
      }
    }
  }
  restore(window.openai?.widgetState);
  render();
  window.addEventListener(&#x27;openai:set_globals&#x27;,e=&gt;{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
})();
&lt;/script&gt;

        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
