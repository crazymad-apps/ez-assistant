[package]
name = "ez-assistant-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ez_assistant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 经用户确认，仅 browser_resource/platform.rs 的 macOS FFI 可局部允许 unsafe。
# 其他桌面代码仍默认拒绝，workspace 其他成员继续继承 forbid。
[lints.rust]
unsafe_code = "deny"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
assistant-protocol = { path = "../../../crates/assistant-protocol" }
dirs.workspace = true
getrandom.workspace = true
infer.workspace = true
image.workspace = true
libc.workspace = true
base64.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.11.5", features = ["image-png", "tray-icon", "unstable"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-window-state = "2"
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { workspace = true, features = ["io"] }
url.workspace = true


[target.'cfg(target_os = "macos")'.dependencies]
# platform.rs 按该版本的 WithWebview +1 所有权接管句柄，升级必须同步移除补偿。
tauri-runtime-wry = "=2.11.4"
# Already present through tauri-utils; read Safari's installed version without shelling out.
security-framework = "=3.7.0"
plist = { version = "=1.10.0", default-features = false }
# 复用 Tauri/Wry 已有的 Apple 绑定版本；用于网页快照、图片编码及句柄生命周期。
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSValue", "NSURL", "NSString"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSView", "NSWindow"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "WKUserContentController", "block2"] }
