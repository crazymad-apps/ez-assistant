[package]
name = "ez-assistant-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ez_assistant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 经用户确认，浏览器、Windows 进程/文件归属、通知前台查询及更新启动锁 FFI 可局部允许 unsafe。
# 其他桌面代码仍默认拒绝，workspace 其他成员继续继承 forbid。
[lints.rust]
unsafe_code = "deny"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
sha2.workspace = true
assistant-protocol = { path = "../../../crates/assistant-protocol" }
dirs.workspace = true
getrandom.workspace = true
infer.workspace = true
image.workspace = true
libc.workspace = true
base64.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.11.5", features = ["macos-private-api", "image-png", "tray-icon", "unstable"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "=2.12.0"
minisign-verify = "=0.2.4"
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
tokio-util = { workspace = true, features = ["io"] }
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }


[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = { version = "=0.3.1", default-features = false }
# platform.rs 按该版本的 WithWebview +1 所有权接管句柄，升级必须同步移除补偿。
tauri-runtime-wry = "=2.11.4"
# Already present through tauri-utils; read Safari's installed version without shelling out.
security-framework = "=3.7.0"
plist = { version = "=1.10.0", default-features = false }
# 复用 Tauri/Wry 已有的 Apple 绑定版本；用于网页快照、图片编码及句柄生命周期。
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSValue", "NSURL", "NSString"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSView", "NSWindow"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "WKUserContentController", "block2"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "=2.4.5"
windows = { version = "=0.61.3", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
