# 仅作本机测试端口转发，不属于 Client 或 Host 产品依赖。
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 256; }
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 17240;
        set $host_backend ez-assistant-m5-linux:17240;
        proxy_pass $host_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}
