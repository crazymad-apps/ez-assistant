[package]
name = "assistant-runtime-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.89"

[[bin]]
name = "ez-assistant-runtime"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
agent-context = { path = "../../crates/agent-context" }
agent-core = { path = "../../crates/agent-core" }
agent-model = { path = "../../crates/agent-model" }
agent-memory = { path = "../../crates/agent-memory" }
agent-provider-openai-compatible = { path = "../../crates/agent-provider-openai-compatible" }
agent-sdk = { path = "../../crates/agent-sdk" }
agent-tools = { path = "../../crates/agent-tools" }
agent-tools-local = { path = "../../crates/agent-tools-local" }
agent-types = { path = "../../crates/agent-types" }
assistant-protocol = { path = "../../crates/assistant-protocol" }
assistant-runtime = { path = "../../crates/assistant-runtime" }
async-stream.workspace = true
axum = { workspace = true, features = ["multipart"] }
base64.workspace = true
clap.workspace = true
dirs.workspace = true
futures-core.workspace = true
getrandom.workspace = true
libc.workspace = true
rusqlite = { version = "0.40.1", features = ["bundled"], default-features = false }
schemars = "1.2.1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "net", "rt-multi-thread", "signal"] }
tokio-util.workspace = true
tempfile.workspace = true

[dev-dependencies]
agent-testkit = { path = "../../crates/agent-testkit" }
reqwest = { workspace = true, features = ["blocking", "multipart"] }
toml.workspace = true
