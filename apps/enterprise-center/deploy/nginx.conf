# 静态入口与 API 明确分流；不以首页兜底未知路径或后端错误。
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    autoindex off;
    disable_symlinks on;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # API 保留自身缓存规则；只有哈希资源长期缓存，正文每次重新验证。
    map $uri $static_cache {
        default no-store;
        /site-content/content.json no-cache;
        "~^/site-content/assets/[0-9a-f]{64}\.(png|jpeg|webp)$" "public, max-age=31536000, immutable";
        ~^/(site-assets|admin/assets)/[a-zA-Z0-9_-]+\.(js|css|svg|png|webp|woff2?)$ "public, max-age=31536000, immutable";
    }
    map $upstream_http_cache_control $response_cache { default $upstream_http_cache_control; '' $static_cache; }
    map $uri $static_csp {
        ~^/api(/|$) '';
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
    }
    # Docker DNS 随 Center 重建重新解析，入口不保存已销毁容器的地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream center_backend { zone center_backend 64k; server center:7320 resolve; }
    server {
        listen 8080;
        root /srv/public/site;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy $static_csp always;
        add_header Cache-Control $response_cache always;
        # 与既有插件 2 GiB、安装包双 512 MiB 的业务限额兼容，具体限额由 Center 校验。
        client_max_body_size 2g;
        client_body_timeout 3600s;
        send_timeout 3600s;
        location = /api { include /etc/nginx/center-proxy.conf; }
        location ^~ /api/ { include /etc/nginx/center-proxy.conf; }
        location = /admin { return 308 /admin/; }
        location ^~ /admin/ {
            root /srv/public;
            location = /admin/ { try_files /admin/index.html =404; }
            location ~ ^/admin/assets/[a-zA-Z0-9_-]+\.(js|css|svg|png|webp|woff2?)$ { try_files $uri =404; }
            try_files /__no_public_file__ =404;
        }
        location ^~ /site-assets/ {
            location ~ ^/site-assets/[a-zA-Z0-9_-]+\.(js|css|svg|png|webp|woff2?)$ { try_files $uri =404; }
            try_files /__no_public_file__ =404;
        }
        location ^~ /site-content/ {
            root /srv;
            location = /site-content/content.json { try_files $uri =404; }
            location ~ "^/site-content/assets/[0-9a-f]{64}\.(png|jpeg|webp)$" { try_files $uri =404; }
            try_files /__no_public_file__ =404;
        }
        location = / { try_files /index.html =503; }
        location = /download { try_files /index.html =503; }
        location = /changelog { try_files /index.html =503; }
        location = /manual { try_files /index.html =503; }
        location ~ ^/manual/[a-z0-9]+(?:-[a-z0-9]+)*$ { try_files /index.html =503; }
        location / { return 404; }
    }
}
